<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Central de Montagens</title>
    <!-- Reaproveita os estilos globais e adiciona o CSS específico do login abaixo -->
    <link rel="stylesheet" href="/css/login.css" />
    <style>
      /* Estilização moderna embutida para garantir o funcionamento visual imediato */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-container {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 2px 4px -1px rgba(0, 0, 0, 0.03);
        border: 1px solid #e2e8f0;
        text-align: center;
      }

      .login-header h1 {
        font-size: 24px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 8px;
      }

      .login-header p {
        font-size: 14px;
        color: #64748b;
        margin-bottom: 30px;
      }

      .form-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
      }

      .form-group input {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        transition: all 0.2s ease-in-out;
      }

      .form-group input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        background-color: #f8fafc;
      }

      .btn-entrar {
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
        transition: all 0.2s ease-in-out;
        margin-top: 10px;
      }

      .btn-entrar:hover {
        background: #1d4ed8;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>🛠️ Central Montagens</h1>
        <p>Faça login para gerenciar a agenda</p>
      </div>

      <!-- FORMULÁRIO COM OS IDs EXATOS DO JAVASCRIPT -->
      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            placeholder="Digite seu usuário"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-entrar">Entrar no Sistema</button>
      </form>
    </div>

    <!-- CHAMA O SCRIPT DE VALIDAÇÃO (Garante que o caminho bate com seu js público) -->
    <script src="/js/login.js"></script>
  </body>
</html>
