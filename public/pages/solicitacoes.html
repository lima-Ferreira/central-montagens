<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solicitações</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/solicitacoes.css" />
    <link rel="stylesheet" href="/css/responsivo.css" />
  </head>

  <body>
    <div class="layout">
      <!-- MENU LATERAL -->
      <aside class="sidebar">
        <div class="logo">
          🛠️ Central
          <span>Montagens</span>
        </div>

        <nav>
          <a href="/pages/dashboard.html"> 🏠 Dashboard </a>
          <a href="/pages/agenda.html"> 📅 Agenda </a>
          <a href="/pages/solicitacoes.html" class="active">
            🚚 Solicitações
          </a>
          <a href="/pages/montadores.html"> 👷 Montadores </a>
          <a href="/pages/lojas.html"> 🏪 Lojas </a>
          <a href="/pages/relatorios.html"> 📊 Relatórios </a>
          <a href="/pages/configuracoes.html"> ⚙ Configurações </a>
        </nav>
      </aside>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="content">
        <header class="topbar">
          <h2>Solicitações</h2>
          <button class="btn-nova" onclick="abrirModal()">
            + Nova Solicitação
          </button>
        </header>

        <div class="filtros">
          <button class="filtro ativo">Todas</button>
          <button class="filtro">Pendentes</button>
          <button class="filtro">Agendadas</button>
          <button class="filtro">Concluídas</button>
        </div>

        <section class="painel">
          <table>
            <thead>
              <tr>
                <th>Nº</th>
                <th>Loja</th>
                <th>Cidade</th>
                <th>Qtd.</th>
                <th>Data</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="listaSolicitacoes"></tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- MODAL ATUALIZADO COM OPÇÃO DE FOLGA (REDUPLICADO E CORRIGIDO) -->
    <div class="modal" id="modal" style="display: none">
      <div class="modal-box">
        <h2>Nova Solicitação / Ocorrência</h2>

        <label> Tipo de Registro </label>
        <select id="tipo_montagem" onchange="mudouTipo()">
          <option value="Cliente">Cliente Final (Entrega de Venda)</option>
          <option value="Mostruário">Mostruário / Exposição na Loja</option>
          <option value="Ausência">⚠️ Folga / Ausência de Montador</option>
        </select>

        <label id="labelLoja"> Loja vinculada </label>
        <select id="loja">
          <option>Loja 01 - Matriz (Russas)</option>
          <option>Loja 02 - Filial 2 (Palhano)</option>
          <option>Loja 03 - Filial 3 (Jaguaruana)</option>
          <option>Loja 04 - Filial 4 (Russas)</option>
          <option>Loja 05 - Filial 5 (Russas)</option>
          <option>Loja 06 - Filial 6 (Limoeiro)</option>
          <option>Loja 08 - Filial 8 (Itaiçaba)</option>
          <option>Loja 09 - Flores 9 (Russas)</option>
          <option>Loja 13 - Filial 13 (Aracati)</option>
        </select>

        <label id="labelSolicitante">
          A pedido de (Nome do Solicitante/Montador)
        </label>
        <input
          type="text"
          id="solicitante"
          placeholder="Ex: Gerente Carlos ou Nome do Montador..."
        />

        <div id="camposEscondiveis">
          <label> Quantidade de montadores </label>
          <input type="number" id="quantidade" min="1" value="1" />

          <label> Prioridade </label>
          <select id="prioridade">
            <option>Normal</option>
            <option>Urgente</option>
          </select>
        </div>

        <label> Data do Evento </label>
        <input type="date" id="data" />

        <!-- Procure por esse bloco e deixe exatamente assim: -->
        <label> Motivo / Observação complementar </label>
        <textarea
          id="observacao"
          placeholder="Digite detalhes importantes aqui..."
          rows="4"
        ></textarea>

        <div class="acoes">
          <button class="cancelar" onclick="fecharModal()">Cancelar</button>
          <button class="salvar" onclick="salvarSolicitacao()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- SCRIPT CONTROLADO COM CACHE ATUALIZADO -->
    <script src="/js/solicitacoes.js?v=4"></script>
  </body>
</html>
